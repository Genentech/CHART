[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chart"
description = "Cellular High-content imaging Archetype Response Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Genentech, Inc." }]
dynamic = ["version"]
dependencies = [
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "seaborn",
]

# numba compiles the quantile normalisation kernel.  It supports a narrower
# range of numpy versions than anything else here, so it is the dependency
# most likely to constrain an install; see OPEN_ISSUES.md for the way out.

# scallops supplies the readers for registered images.  It is not published
# on PyPI, so it has to be installed separately; without it CHART skips the
# components that need image data rather than failing.

[project.scripts]
chart = "chart.cli:main"

[project.urls]
Repository = "https://github.com/Genentech/CHART"

[tool.setuptools.dynamic]
version = { attr = "chart.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
